<section id="stack" class="stack-section" aria-labelledby="stack-title">
  <div class="stack-shell">
    <header class="stack-header">
      <p class="stack-index" data-reveal>[002]</p>
      <h2 id="stack-title" class="stack-title" data-reveal style="--reveal-delay: 70ms;">
        Stack
      </h2>
    </header>

    <div class="stack-groups">
      <article class="stack-group" data-reveal="left">
        <div class="stack-group-heading">
          <span class="stack-group-number" aria-hidden="true">01</span>
          <h3 class="stack-group-title">Mobile Development</h3>
        </div>

        <ul class="stack-tools stack-tools--three" role="list" aria-label="Mobile development technologies">
          <li class="stack-tool">
            <span class="stack-tool-icon" aria-hidden="true">
              <img src="images/swift-og.png" alt="" loading="lazy" decoding="async">
            </span>
            <span>Swift</span>
          </li>
          <li class="stack-tool">
            <span class="stack-tool-icon stack-tool-monogram" aria-hidden="true">UI</span>
            <span>SwiftUI</span>
          </li>
          <li class="stack-tool">
            <span class="stack-tool-icon stack-tool-monogram stack-tool-database" aria-hidden="true"></span>
            <span>Core Data</span>
          </li>
        </ul>
      </article>

      <article class="stack-group" data-reveal="right" style="--reveal-delay: 40ms;">
        <div class="stack-group-heading">
          <span class="stack-group-number" aria-hidden="true">02</span>
          <h3 class="stack-group-title">Web Development</h3>
        </div>

        <ul class="stack-tools stack-tools--three" role="list" aria-label="Web development technologies">
          <li class="stack-tool">
            <span class="stack-tool-icon" aria-hidden="true">
              <img src="images/html-1.svg" alt="" loading="lazy" decoding="async">
            </span>
            <span>HTML5</span>
          </li>
          <li class="stack-tool">
            <span class="stack-tool-icon" aria-hidden="true">
              <img src="images/Official_CSS_Logo.svg.png" alt="" loading="lazy" decoding="async">
            </span>
            <span>CSS3</span>
          </li>
          <li class="stack-tool">
            <span class="stack-tool-icon stack-tool-responsive" aria-hidden="true">
              <span></span>
            </span>
            <span>Responsive Design</span>
          </li>
        </ul>
      </article>

      <article class="stack-group" data-reveal="left" style="--reveal-delay: 80ms;">
        <div class="stack-group-heading">
          <span class="stack-group-number" aria-hidden="true">03</span>
          <h3 class="stack-group-title">Workflow &amp; Tooling</h3>
        </div>

        <ul class="stack-tools stack-tools--four" role="list" aria-label="Development workflow tools">
          <li class="stack-tool">
            <span class="stack-tool-icon" aria-hidden="true">
              <img src="images/Git_icon.svg.png" alt="" loading="lazy" decoding="async">
            </span>
            <span>Git</span>
          </li>
          <li class="stack-tool">
            <span class="stack-tool-icon" aria-hidden="true">
              <img src="images/Octicons-mark-github.svg.png" alt="" loading="lazy" decoding="async">
            </span>
            <span>GitHub</span>
          </li>
          <li class="stack-tool">
            <span class="stack-tool-icon stack-tool-monogram" aria-hidden="true">XC</span>
            <span>Xcode</span>
          </li>
          <li class="stack-tool">
            <span class="stack-tool-icon stack-tool-monogram" aria-hidden="true">VS</span>
            <span>VS Code</span>
          </li>
        </ul>
      </article>

      <article class="stack-group" data-reveal="right" style="--reveal-delay: 120ms;">
        <div class="stack-group-heading">
          <span class="stack-group-number" aria-hidden="true">04</span>
          <h3 class="stack-group-title">Design Practice</h3>
        </div>

        <ul class="stack-tools stack-tools--two" role="list" aria-label="Design and problem-solving practices">
          <li class="stack-tool">
            <span class="stack-tool-icon stack-tool-monogram" aria-hidden="true">UX</span>
            <span>UI/UX Principles</span>
          </li>
          <li class="stack-tool">
            <span class="stack-tool-icon stack-tool-solve" aria-hidden="true"></span>
            <span>Problem Solving</span>
          </li>
        </ul>
      </article>
    </div>
  </div>
</section>
